<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SUPER MANDO</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        /* ============================================================
           VARIABLES Y RESET
        ============================================================ */
        :root {
            --clr-bg:       #0a0a0f;
            --clr-panel:    #12121a;
            --clr-border:   #2a2a3e;
            --clr-yellow:   #f7d51d;
            --clr-cyan:     #00e5ff;
            --clr-pink:     #ff2d78;
            --clr-green:    #39ff14;
            --clr-blue:     #1e90ff;
            --clr-purple:   #9b30ff;
            --clr-red:      #ff2d2d;
            --clr-text:     #e0e0ff;
            --clr-muted:    #555577;
            --shadow-hard:  4px 4px 0px rgba(0,0,0,0.9);
            --shadow-glow-y: 0 0 12px rgba(247,213,29,0.6), 0 0 30px rgba(247,213,29,0.25);
            --shadow-glow-c: 0 0 12px rgba(0,229,255,0.5), 0 0 30px rgba(0,229,255,0.2);
            --shadow-glow-p: 0 0 12px rgba(255,45,120,0.6), 0 0 30px rgba(255,45,120,0.25);
            --font-pixel:   'Press Start 2P', monospace;
            --font-hud:     'Orbitron', sans-serif;
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            display: flex;
            flex-direction: column;
            height: 100dvh; /* dynamic viewport height */
            padding-bottom: env(safe-area-inset-bottom);
            background-color: var(--clr-bg);
            background-image:
                linear-gradient(rgba(0,229,255,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0,229,255,0.03) 1px, transparent 1px);
            background-size: 32px 32px;
            font-family: var(--font-pixel);
            color: var(--clr-text);
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
            overflow: hidden;
        }

        /* ============================================================
           TOP HUD BAR
        ============================================================ */
        #top-bar {
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 8px;
            height: 44px;
            background-color: #000;
            border-bottom: 2px solid var(--clr-border);
            gap: 8px;
        }

        #hud-player-name {
            font-family: var(--font-hud);
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--clr-cyan);
            text-shadow: var(--shadow-glow-c);
            letter-spacing: 1px;
            flex: 1;
            text-align: center;
        }

        .top-bar-btn {
            background: none;
            border: 1px solid var(--clr-border);
            border-radius: 4px;
            color: var(--clr-muted);
            font-size: 1.1rem;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            flex-shrink: 0;
            touch-action: manipulation;
            padding: 0;
        }

        .top-bar-btn:active {
            color: var(--clr-cyan);
            border-color: var(--clr-cyan);
        }

        /* ============================================================
           POPUP DE AJUSTES
        ============================================================ */
        #settings-backdrop {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.75);
            z-index: 200;
            align-items: center;
            justify-content: center;
        }

        #settings-backdrop.open { display: flex; }

        #settings-popup {
            background: var(--clr-panel);
            border: 2px solid var(--clr-border);
            border-radius: 8px;
            padding: 24px;
            min-width: 260px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            box-shadow: 0 0 0 1px #000, var(--shadow-glow-c);
        }

        #settings-popup h3 {
            font-family: var(--font-pixel);
            font-size: 0.6rem;
            color: var(--clr-yellow);
            text-shadow: var(--shadow-glow-y);
            text-align: center;
            letter-spacing: 2px;
        }

        .settings-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            font-family: var(--font-pixel);
            font-size: 0.5rem;
            color: var(--clr-text);
            letter-spacing: 1px;
        }

        .toggle {
            position: relative;
            width: 44px;
            height: 24px;
            flex-shrink: 0;
        }

        .toggle input { opacity: 0; width: 0; height: 0; position: absolute; }

        .toggle-slider {
            position: absolute;
            inset: 0;
            background: var(--clr-border);
            border-radius: 3px;
            cursor: pointer;
            transition: background 0.15s;
        }

        .toggle-slider::before {
            content: '';
            position: absolute;
            width: 18px; height: 18px;
            left: 3px; top: 3px;
            background: var(--clr-muted);
            border-radius: 2px;
            transition: transform 0.15s, background 0.15s;
        }

        .toggle input:checked + .toggle-slider {
            background: rgba(0,229,255,0.15);
            border: 1px solid var(--clr-cyan);
        }
        .toggle input:checked + .toggle-slider::before {
            transform: translateX(20px);
            background: var(--clr-cyan);
        }

        .btn-settings-action {
            width: 100%;
            padding: 12px;
            font-family: var(--font-pixel);
            font-size: 0.5rem;
            border: 1px solid var(--clr-border);
            border-radius: 4px;
            background: transparent;
            color: var(--clr-text);
            cursor: pointer;
            letter-spacing: 1px;
        }

        .btn-settings-action:active {
            border-color: var(--clr-cyan);
            color: var(--clr-cyan);
        }

        #btn-close-settings {
            width: 100%;
            padding: 12px;
            font-family: var(--font-pixel);
            font-size: 0.5rem;
            border: none;
            border-radius: 4px;
            background: var(--clr-border);
            color: var(--clr-muted);
            cursor: pointer;
            letter-spacing: 1px;
        }

        #host-transfer-panel {
            display: none;
            flex-direction: column;
            gap: 8px;
        }

        #host-transfer-panel.open { display: flex; }

        .btn-player-select {
            width: 100%;
            padding: 10px;
            font-family: var(--font-pixel);
            font-size: 0.45rem;
            border: 1px solid var(--clr-yellow);
            border-radius: 4px;
            background: rgba(247,213,29,0.08);
            color: var(--clr-yellow);
            cursor: pointer;
            letter-spacing: 1px;
        }

        .btn-player-select:active {
            background: rgba(247,213,29,0.25);
        }

        /* ============================================================
           OVERLAYS DE ORIENTACIÓN
        ============================================================ */
        .orientation-overlay {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 300;
            pointer-events: none;
            background: rgba(0,0,0,0.93);
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 24px;
            padding: 32px;
        }

        .orientation-overlay.active { display: flex; pointer-events: all; }

        .orientation-icon {
            font-size: 3.5rem;
            animation: rotate-hint 2.5s ease-in-out infinite;
        }

        @keyframes rotate-hint {
            0%, 30% { transform: rotate(0deg); }
            55%, 80% { transform: rotate(90deg); }
            100%     { transform: rotate(0deg); }
        }

        .orientation-overlay p {
            font-family: var(--font-pixel);
            font-size: clamp(0.55rem, 3.5vw, 0.75rem);
            color: var(--clr-yellow);
            text-shadow: var(--shadow-glow-y);
            text-align: center;
            line-height: 2.2;
        }

        /* ============================================================
           SCREENS SYSTEM
        ============================================================ */
        .screen {
            display: none;
            width: 100%;
            flex: 1;
            min-height: 0;
        }

        /* ============================================================
           SCREEN: ESPERA / UNIRSE
        ============================================================ */
        #screen-espera {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 24px;
            padding: 24px;
        }

        .logo-title {
            text-align: center;
        }

        .logo-title .logo-line1 {
            display: block;
            font-family: var(--font-pixel);
            font-size: clamp(0.8rem, 5vw, 1.2rem);
            color: var(--clr-yellow);
            text-shadow: var(--shadow-hard), var(--shadow-glow-y);
            letter-spacing: 2px;
        }

        .logo-title .logo-line2 {
            display: block;
            font-family: var(--font-hud);
            font-size: clamp(1.6rem, 11vw, 2.4rem);
            font-weight: 900;
            color: var(--clr-cyan);
            text-shadow: var(--shadow-hard), var(--shadow-glow-c);
            letter-spacing: -1px;
            margin-top: 4px;
        }

        /* Scanline decoration */
        .pixel-divider {
            width: 100%;
            max-width: 280px;
            height: 4px;
            background: repeating-linear-gradient(
                90deg,
                var(--clr-yellow) 0px, var(--clr-yellow) 8px,
                transparent 8px, transparent 12px
            );
            border-radius: 2px;
        }

        /* JOIN button */
        #btn-join {
            position: relative;
            background: var(--clr-yellow);
            color: #000;
            border: none;
            padding: 18px 40px;
            font-family: var(--font-pixel);
            font-size: clamp(0.7rem, 4vw, 0.9rem);
            border-radius: 4px;
            cursor: pointer;
            letter-spacing: 1px;
            /* hard shadow for pixel look */
            box-shadow: 4px 4px 0 #a07a00, 8px 8px 0 #5a4500, var(--shadow-glow-y);
            transition: transform 0.08s, box-shadow 0.08s;
            animation: pulse-join 2s ease-in-out infinite;
        }

        #btn-join:active {
            transform: translate(4px, 4px);
            box-shadow: 0 0 0 #a07a00, var(--shadow-glow-y);
        }

        @keyframes pulse-join {
            0%, 100% { box-shadow: 4px 4px 0 #a07a00, 8px 8px 0 #5a4500, var(--shadow-glow-y); }
            50%       { box-shadow: 4px 4px 0 #a07a00, 8px 8px 0 #5a4500, 0 0 25px rgba(247,213,29,0.85), 0 0 60px rgba(247,213,29,0.4); }
        }

        /* Waiting state */
        #txt-espera {
            display: none;
            font-family: var(--font-pixel);
            font-size: clamp(0.55rem, 3.5vw, 0.75rem);
            color: var(--clr-yellow);
            text-align: center;
            line-height: 1.9;
            text-shadow: var(--shadow-glow-y);
            animation: blink-text 1.2s step-end infinite;
        }

        @keyframes blink-text {
            0%, 100% { opacity: 1; }
            50%       { opacity: 0.3; }
        }

        /* ============================================================
           PHOTO / AVATAR SECTION
        ============================================================ */
        #photo-container {
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            width: 100%;
            padding: 0 24px;
        }

        #camera-text {
            font-family: var(--font-pixel);
            font-size: clamp(0.5rem, 3vw, 0.65rem);
            color: var(--clr-cyan);
            text-align: center;
            line-height: 2;
            text-shadow: var(--shadow-glow-c);
        }

        #capture-options {
            display: flex;
            width: 100%;
            justify-content: center;
        }

        .btn-source {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: linear-gradient(135deg, var(--clr-purple), #6600cc);
            color: white;
            padding: 14px 32px;
            font-family: var(--font-pixel);
            font-size: clamp(0.55rem, 3.5vw, 0.7rem);
            border-radius: 4px;
            border: none;
            cursor: pointer;
            width: 100%;
            max-width: 260px;
            box-shadow: 4px 4px 0 #3d0066, var(--shadow-glow-p);
            transition: transform 0.08s, box-shadow 0.08s;
            letter-spacing: 0.5px;
        }

        .btn-source:active {
            transform: translate(4px, 4px);
            box-shadow: 0 0 0 #3d0066;
        }

        /* Preview box */
        #preview-box {
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }

        #preview-photo {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 3px solid var(--clr-yellow);
            object-fit: cover;
            image-rendering: pixelated;
            box-shadow: 0 0 0 3px #000, 0 0 0 5px var(--clr-yellow), var(--shadow-glow-y);
        }

        .action-buttons {
            display: flex;
            gap: 12px;
            width: 100%;
            justify-content: center;
        }

        #btn-send-photo {
            flex: 1;
            max-width: 140px;
            background: var(--clr-green);
            color: #000;
            padding: 14px;
            font-family: var(--font-pixel);
            font-size: clamp(0.5rem, 3vw, 0.6rem);
            border-radius: 4px;
            border: none;
            cursor: pointer;
            box-shadow: 3px 3px 0 #007a00, 0 0 12px rgba(57,255,20,0.4);
            transition: transform 0.08s;
        }

        #btn-send-photo:active { transform: translate(3px, 3px); box-shadow: none; }

        #btn-retake-photo {
            flex: 1;
            max-width: 140px;
            background: var(--clr-red);
            color: white;
            padding: 14px;
            font-family: var(--font-pixel);
            font-size: clamp(0.5rem, 3vw, 0.6rem);
            border-radius: 4px;
            border: none;
            cursor: pointer;
            box-shadow: 3px 3px 0 #7a0000, 0 0 12px rgba(255,45,45,0.4);
            transition: transform 0.08s;
        }

        #btn-retake-photo:active { transform: translate(3px, 3px); box-shadow: none; }

        /* ============================================================
           CROP SCREEN
        ============================================================ */
        #crop-screen {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
            width: 100%;
            height: 100dvh;
            position: fixed;
            top: 0; left: 0;
            background-color: var(--clr-bg);
            background-image:
                linear-gradient(rgba(155,48,255,0.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(155,48,255,0.04) 1px, transparent 1px);
            background-size: 24px 24px;
            z-index: 100;
            padding: 20px;
        }

        #crop-screen h2 {
            font-family: var(--font-pixel);
            font-size: clamp(0.6rem, 4vw, 0.9rem);
            color: var(--clr-yellow);
            text-shadow: var(--shadow-hard), var(--shadow-glow-y);
            text-align: center;
            letter-spacing: 1px;
        }

        #crop-frame {
            width: 240px;
            height: 240px;
            border-radius: 50%;
            overflow: hidden;
            position: relative;
            background-color: #1a1a2e;
            /* Layered border: hard pixel + glow */
            box-shadow:
                0 0 0 4px #000,
                0 0 0 7px var(--clr-yellow),
                0 0 0 9px #000,
                var(--shadow-glow-y);
        }

        #crop-image {
            position: absolute;
            left: 50%; top: 50%;
            transform: translate(-50%, -50%);
            user-select: none;
            -webkit-user-drag: none;
            cursor: grab;
        }

        #crop-image:active { cursor: grabbing; }

        .zoom-label {
            font-family: var(--font-pixel);
            font-size: 0.5rem;
            color: var(--clr-muted);
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        #zoom-slider {
            -webkit-appearance: none;
            width: 240px;
            height: 6px;
            background: var(--clr-border);
            border-radius: 3px;
            outline: none;
            border: 1px solid var(--clr-muted);
        }

        #zoom-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 20px; height: 20px;
            background: var(--clr-yellow);
            border-radius: 3px;
            box-shadow: 2px 2px 0 #5a4500;
            cursor: pointer;
        }

        .crop-actions {
            display: flex;
            gap: 16px;
        }

        .btn-crop-action {
            padding: 14px 24px;
            font-family: var(--font-pixel);
            font-size: clamp(0.5rem, 3vw, 0.65rem);
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: transform 0.08s;
        }

        #btn-retake-crop {
            background: var(--clr-red);
            color: white;
            box-shadow: 3px 3px 0 #7a0000;
        }

        #btn-confirm-crop {
            background: var(--clr-green);
            color: #000;
            box-shadow: 3px 3px 0 #007a00;
        }

        #btn-retake-crop:active, #btn-confirm-crop:active {
            transform: translate(3px, 3px);
            box-shadow: none;
        }

        /* ============================================================
           CONTROLLER LAYOUTS — SHARED
        ============================================================ */
        .layout-panel {
            display: none;
            width: 100%;
            flex: 1;
            min-height: 0;
        }

        /* ============================================================
           LAYOUT: BOTONES DIRECCIONALES
        ============================================================ */
        #layout-botones {
            flex-direction: row;
        }

        #left-hand-btns {
            display: flex;
            flex-direction: row;
            width: 50%;
            border-right: 3px solid #000;
        }

        .btn-dir {
            flex: 1;
            background: linear-gradient(180deg, #1a5fa8, #0d3a68);
            border: none;
            font-size: clamp(2rem, 10vw, 4rem);
            color: var(--clr-cyan);
            border-right: 2px solid #000;
            text-shadow: var(--shadow-glow-c);
            /* Inset shadow for depth */
            box-shadow: inset 0 3px 0 rgba(255,255,255,0.12), inset 0 -5px 0 rgba(0,0,0,0.4);
            transition: filter 0.06s, transform 0.06s;
        }

        #btn-right {
            background: linear-gradient(180deg, #2070bb, #124080);
        }

        .right-hand-action {
            display: flex;
            width: 50%;
            padding: 14px;
        }

        /* ============================================================
           LAYOUT: JOYSTICK
        ============================================================ */
        #layout-joystick {
            flex-direction: row;
        }

        #joy-zone {
            width: 50%;
            position: relative;
            border-right: 3px solid #000;
            background: radial-gradient(circle at 50% 50%, #1a1a2e 0%, #0a0a12 100%);
        }

        /* subtle crosshair hint */
        #joy-zone::before, #joy-zone::after {
            content: '';
            position: absolute;
            left: 50%; top: 50%;
            transform: translate(-50%, -50%);
            background: var(--clr-border);
            pointer-events: none;
        }
        #joy-zone::before { width: 60px; height: 1px; }
        #joy-zone::after  { width: 1px;  height: 60px; }

        #joy-base {
            position: absolute;
            width: 120px; height: 120px;
            border-radius: 50%;
            background: rgba(0,229,255,0.06);
            border: 2px solid rgba(0,229,255,0.25);
            transform: translate(-50%, -50%);
            display: none;
            pointer-events: none;
            box-shadow: 0 0 20px rgba(0,229,255,0.15);
        }

        #joy-stick {
            position: absolute;
            width: 52px; height: 52px;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 35%, var(--clr-cyan), var(--clr-blue));
            transform: translate(-50%, -50%);
            pointer-events: none;
            box-shadow: 0 0 12px rgba(0,229,255,0.7), inset 0 2px 0 rgba(255,255,255,0.3), 3px 3px 0 rgba(0,0,0,0.5);
        }

        /* ============================================================
           SHARED: ACTION / DASH BUTTON
        ============================================================ */
        .btn-dash {
            flex: 1;
            background: linear-gradient(180deg, var(--clr-pink), #990040);
            border: none;
            border-radius: 16px;
            font-family: var(--font-pixel);
            font-size: clamp(0.55rem, 3.5vw, 0.75rem);
            font-weight: bold;
            color: white;
            letter-spacing: 0.5px;
            touch-action: none;
            box-shadow:
                0 6px 0 #5a0028,
                inset 0 3px 0 rgba(255,255,255,0.2),
                0 0 20px rgba(255,45,120,0.4);
            text-shadow: 0 1px 3px rgba(0,0,0,0.5);
            transition: filter 0.06s;
        }

        /* ============================================================
           LAYOUT: UN BOTÓN
        ============================================================ */
        #layout-un-boton {
            padding: 20px;
        }

        #btn-gigante {
            width: 100%;
            height: 100%;
            background: linear-gradient(180deg, #ff3040, #8a0010);
            border: none;
            border-radius: 24px;
            font-family: var(--font-pixel);
            font-size: clamp(1.2rem, 8vw, 2.2rem);
            font-weight: bold;
            color: white;
            letter-spacing: 1px;
            touch-action: none;
            box-shadow:
                0 10px 0 #4a0008,
                inset 0 4px 0 rgba(255,255,255,0.15),
                0 0 40px rgba(255,45,60,0.35);
            text-shadow: 3px 3px 0 rgba(0,0,0,0.5);
        }

        /* ============================================================
           ACTIVE / PRESSED STATES
        ============================================================ */
        .btn-pressed-dir {
            filter: brightness(0.55);
            box-shadow: inset 0 6px 0 rgba(0,0,0,0.5) !important;
        }

        .btn-pressed-dash {
            filter: brightness(0.6);
            box-shadow: 0 2px 0 #5a0028, inset 0 4px 0 rgba(0,0,0,0.4) !important;
            transform: translateY(4px);
        }

        .btn-pressed-gigante {
            filter: brightness(0.65);
            box-shadow: 0 3px 0 #4a0008, inset 0 6px 0 rgba(0,0,0,0.4) !important;
            transform: translateY(7px);
        }

        /* ============================================================
           PIXEL CORNER DECORATIONS (applied via pseudo on panels)
        ============================================================ */
        #layout-botones, #layout-joystick, #layout-un-boton {
            position: relative;
        }

        /* Corner notch decorations */
        #layout-botones::before,
        #layout-joystick::before {
            content: '';
            position: absolute;
            bottom: 8px; left: 50%;
            transform: translateX(-50%);
            width: 40px; height: 2px;
            background: var(--clr-border);
            z-index: 10;
            pointer-events: none;
        }

        /* ============================================================
           LAYOUT: MENÚ HOST (D-pad + aceptar)
        ============================================================ */
        #layout-menu {
            flex-direction: row;
            position: relative;
            overflow: hidden;
        }

        #layout-menu::before {
            content: '';
            position: absolute;
            bottom: 8px; left: 50%;
            transform: translateX(-50%);
            width: 40px; height: 2px;
            background: var(--clr-border);
            z-index: 10;
            pointer-events: none;
        }

        #dpad-zone {
            width: 55%;
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            grid-template-rows: 1fr 1fr 1fr;
            gap: 4px;
            padding: 12px;
            padding-bottom: max(12px, env(safe-area-inset-bottom));
            border-right: 3px solid #000;
            min-height: 0;
        }

        .btn-dpad {
            background: linear-gradient(180deg, #1a3a6a, #0d2040);
            border: none;
            border-radius: 6px;
            font-size: clamp(1.2rem, 6vw, 2rem);
            color: var(--clr-cyan);
            text-shadow: var(--shadow-glow-c);
            box-shadow: inset 0 3px 0 rgba(255,255,255,0.1), inset 0 -4px 0 rgba(0,0,0,0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            touch-action: none;
            transition: filter 0.06s;
        }

        /* Centro del D-pad vacío */
        .dpad-center {
            background: transparent !important;
            box-shadow: none !important;
            pointer-events: none;
        }

        .btn-dpad:active, .btn-dpad.btn-pressed-dir {
            filter: brightness(0.55);
            box-shadow: inset 0 6px 0 rgba(0,0,0,0.5) !important;
        }

        #accept-zone {
            width: 45%;
            padding: 14px;
            padding-bottom: max(14px, env(safe-area-inset-bottom));
            display: flex;
            min-height: 0;
        }

        /* ============================================================
           LAYOUT: LOBBY HOST (botón COMENZAR)
        ============================================================ */
        #layout-lobby-host {
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 32px;
            padding: 24px;
        }

        #lobby-host-title {
            font-family: var(--font-pixel);
            font-size: clamp(0.55rem, 3.5vw, 0.75rem);
            color: var(--clr-cyan);
            text-shadow: var(--shadow-glow-c);
            text-align: center;
            line-height: 2;
            letter-spacing: 1px;
        }

        #btn-comenzar {
            width: 100%;
            max-width: 320px;
            padding: 28px 20px;
            background: linear-gradient(180deg, var(--clr-green), #1a8a00);
            border: none;
            border-radius: 12px;
            font-family: var(--font-pixel);
            font-size: clamp(0.8rem, 5vw, 1.1rem);
            color: #000;
            letter-spacing: 1px;
            touch-action: none;
            box-shadow: 0 8px 0 #007a00, inset 0 3px 0 rgba(255,255,255,0.2), 0 0 30px rgba(57,255,20,0.3);
            text-shadow: none;
            transition: transform 0.08s, box-shadow 0.08s;
        }

        #btn-comenzar:active {
            transform: translateY(6px);
            box-shadow: 0 2px 0 #007a00, inset 0 3px 0 rgba(255,255,255,0.1);
        }

        /* ============================================================
           LAYOUT: GIRA EL MÓVIL
        ============================================================ */
        #layout-gira {
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 28px;
            padding: 32px;
            background-color: var(--clr-bg);
        }

        #gira-icon {
            font-size: 4rem;
            animation: gira-anim 1.8s ease-in-out infinite;
        }

        @keyframes gira-anim {
            0%, 100% { transform: rotate(0deg); }
            40%       { transform: rotate(90deg); }
            60%       { transform: rotate(90deg); }
        }

        #layout-gira p {
            font-family: var(--font-pixel);
            font-size: clamp(0.6rem, 4vw, 0.85rem);
            color: var(--clr-yellow);
            text-shadow: var(--shadow-glow-y);
            text-align: center;
            line-height: 2.2;
        }

        #layout-gira .pixel-divider {
            max-width: 200px;
        }

        /* ============================================================
           RESPONSIVE: ensure no overflow
        ============================================================ */
        @media (max-height: 580px) {
            #crop-frame { width: 180px; height: 180px; }
            .logo-title .logo-line2 { font-size: 1.4rem; }
            #btn-join { padding: 14px 28px; }
        }
    </style>
</head>
<body oncontextmenu="return false;">

    <!-- ═══════════════════════ HUD BAR ═══════════════════════ -->
    <div id="top-bar">
        <button class="top-bar-btn" id="btn-fullscreen" title="Pantalla completa">⛶</button>

    <!-- ═══════════════════════ POPUP AJUSTES ═══════════════════════ -->

        <div id="settings-popup">

                <span>VIBRACIÓN</span>

                </label>
            </div>
            <button class="btn-settings-action" id="btn-dar-host" style="display:none; border-color: var(--clr-yellow); color: var(--clr-yellow);">👑 &nbsp;DAR HOST</button>
            <div id="host-transfer-panel">

    <!-- ═══════════════════════ OVERLAY: PON EN VERTICAL ═══════════════════════ -->

    <!-- ═══════════════════════ OVERLAY: PON EN HORIZONTAL ═══════════════════════ -->
    <div class="orientation-overlay" id="overlay-landscape">
        <div class="orientation-icon">📱</div>
        <p>PON EL MÓVIL<br>EN HORIZONTAL</p>
    </div>

    <!-- ═══════════════════════ SCREEN: ESPERA ═══════════════════════ -->
    <div id="screen-espera" class="screen" style="display: flex;">

        <div class="logo-title">
            <span class="logo-line1">◆ PARTY GAME ◆</span>

        </div>

        <div class="pixel-divider"></div>

        <button id="btn-join">[ UNIRSE ]</button>

        <p id="txt-espera">▼ ESPERANDO AL HOST ▼</p>

        <!-- Avatar section -->
        <div id="photo-container">
            <p id="camera-text">▶ ELIGE TU AVATAR ◀</p>

            <div id="capture-options" style="display: flex; width: 100%; justify-content: center;">
                <label for="avatar-input" class="btn-source">📸 &nbsp;ELEGIR AVATAR</label>
            </div>

            <!-- HACK: application/pdf fuerza menú Cámara/Galería en Android -->
            <input type="file" id="avatar-input" accept="image/jpeg, image/png, application/pdf" style="display: none;">

            <div id="preview-box">
                <img id="preview-photo" src="" alt="Avatar">
                <div class="action-buttons">
                    <button id="btn-retake-photo">↻ REPETIR</button>
                    <button id="btn-send-photo">ENVIAR ✓</button>

        </div>

    </div>

    <!-- ═══════════════════════ CROP SCREEN ═══════════════════════ -->
    <div id="crop-screen">
        <h2>◈ AJUSTA TU CARA ◈</h2>

        <div style="display: flex; flex-direction: column; align-items: center; gap: 10px; width: 100%;">
            <span class="zoom-label">· ZOOM ·</span>

        </div>
    </div>

    <!-- ═══════════════════════ LAYOUT: BOTONES DIRECCIONALES ═══════════════════════ -->
    <div id="layout-botones" class="screen layout-panel">
        <div id="left-hand-btns">
            <button class="btn-dir control-btn" data-action="left">◀</button>
            <button class="btn-dir control-btn" data-action="right">▶</button>

            <button class="btn-dash control-btn" data-action="dash">ACCIÓN</button>
        </div>
    </div>

    <!-- ═══════════════════════ LAYOUT: JOYSTICK ═══════════════════════ -->
    <div id="layout-joystick" class="screen layout-panel">
        <div id="joy-zone">
            <div id="joy-base">
                <div id="joy-stick"></div>
            </div>
        </div>
        <div class="right-hand-action">
            <button class="btn-dash control-btn" data-action="dash">ACCIÓN</button>
        </div>
    </div>

    <!-- ═══════════════════════ LAYOUT: UN BOTÓN ═══════════════════════ -->
    <div id="layout-un-boton" class="screen layout-panel">
        <button id="btn-gigante" class="control-btn" data-action="dash">¡PULSA!</button>
    </div>

    <!-- ═══════════════════════ LAYOUT: MENÚ HOST ═══════════════════════ -->
    <div id="layout-menu" class="screen layout-panel">
        <div id="dpad-zone">
            <div class="dpad-center"></div>
            <button class="btn-dpad control-btn" data-action="up">▲</button>
            <div class="dpad-center"></div>
            <button class="btn-dpad control-btn" data-action="left">◀</button>
            <div class="dpad-center"></div>
            <button class="btn-dpad control-btn" data-action="right">▶</button>
            <div class="dpad-center"></div>
            <button class="btn-dpad control-btn" data-action="down">▼</button>
            <div class="dpad-center"></div>
        </div>
        <div id="accept-zone">
            <button class="btn-dash control-btn" data-action="dash">OK</button>
        </div>
    </div>

    <!-- ═══════════════════════ LAYOUT: LOBBY HOST ═══════════════════════ -->
    <div id="layout-lobby-host" class="screen layout-panel">
        <p id="lobby-host-title">👑 ERES EL HOST</p>
        <div class="pixel-divider"></div>
        <button id="btn-comenzar">▶ &nbsp;COMENZAR PARTIDA</button>
    </div>

    <!-- ═══════════════════════ LAYOUT: GIRA EL MÓVIL ═══════════════════════ -->
    <div id="layout-gira" class="screen layout-panel">
        <div id="gira-icon">📱</div>
        <div class="pixel-divider"></div>
        <p>PON EL MÓVIL<br>EN HORIZONTAL<br>¡YA CASI!</p>
    </div>

    <script>
    // ================================================================
    //  CONFIG
    // ================================================================
    const IP_DEL_PC = window.location.hostname || "127.0.0.1";
    const SIZE = 64; // Tamaño final del avatar para Godot

    // ================================================================
    //  REFERENCIAS DOM
    // ================================================================
    const hudPlayerName   = document.getElementById("hud-player-name");
    const btnJoin         = document.getElementById("btn-join");
    const txtEspera       = document.getElementById("txt-espera");
    const photoContainer  = document.getElementById("photo-container");
    const previewBox      = document.getElementById("preview-box");
    const previewPhoto    = document.getElementById("preview-photo");
    const btnSendPhoto    = document.getElementById("btn-send-photo");
    const cameraText      = document.getElementById("camera-text");
    const captureOptions  = document.getElementById("capture-options");
    const avatarInput     = document.getElementById("avatar-input");

    // Crop
    const cropScreen      = document.getElementById("crop-screen");
    const cropImage       = document.getElementById("crop-image");
    const zoomSlider      = document.getElementById("zoom-slider");

    // ================================================================
    //  ESTADO GLOBAL
    // ================================================================
    let ws        = null;
    let wakeLock  = null;
    let finalBase64Data = "";
    let isHost    = false; // El servidor nos lo confirma con host_status

    // Estado cropper — NO TOCAR las matemáticas de estos valores
    let imgCenterX = 0, imgCenterY = 0;
    let currentScale = 1;
    let isDragging = false;
    let startX, startY;
    let initialDistance = 0, initialScale = 1;
    let initialPinchMidX = 0, initialPinchMidY = 0;
    let initialCenterX = 0, initialCenterY = 0;

    // ================================================================
    //  HELPERS
    // ================================================================
    function vibrar() { if (navigator.vibrate) navigator.vibrate(40); }

    // ================================================================
    //  GESTOR DE PANTALLAS
    // ================================================================
    function mostrarSoloScreen(id) {
        document.querySelectorAll('.screen').forEach(s => s.style.display = 'none');
        const target = document.getElementById(id);
        if (target) target.style.display = (id === "layout-un-boton") ? "block" : "flex";
    }

    function cambiarLayout(nombre) {
        const map = {
            "espera":   "screen-espera",
            "botones":  "layout-botones",
            "joystick": "layout-joystick",
            "un_boton": "layout-un-boton",
            "menu":     "layout-menu",
            "gira":     "layout-gira",
            "lobby_host": "layout-lobby-host",
        };
        const layoutsMando = ["botones", "joystick", "un_boton", "menu"];
        if (map[nombre]) {
            // Si llega "gira" pero ya estamos en horizontal, ignorarlo
            if (nombre === "gira" && window.innerWidth > window.innerHeight) return;

            mandoActivo = layoutsMando.includes(nombre);
            if (!mandoActivo) overlayLandscape.classList.remove('active');
            mostrarSoloScreen(map[nombre]);
            if (typeof checkOrientation === 'function') checkOrientation();
        }
    }

    // ================================================================
    //  WEBSOCKET & RED
    // ================================================================
    function conectar() {
        ws = new WebSocket(`ws://${IP_DEL_PC}:8080`);

        ws.onmessage = (event) => {
            const data = JSON.parse(event.data);

            if (data.type === "welcome") {
                hudPlayerName.innerText = "JUGADOR " + data.player_id;
                // Registrar jugadores conocidos para el panel de transferencia
                if (!connectedPlayerIds.includes(data.player_id)) {
                    connectedPlayerIds.push(data.player_id);
                }
                btnJoin.style.display = "none";
                txtEspera.style.display = "block";
                photoContainer.style.display = "flex";
            }

            if (data.type === "change_layout") {
                cambiarLayout(data.layout);
            }

            if (data.type === "host_status") {
                isHost = data.is_host;
                const btnDarHost = document.getElementById('btn-dar-host');
                if (btnDarHost) btnDarHost.style.display = isHost ? 'block' : 'none';
                // Guardar lista de jugadores si viene adjunta
                if (data.player_ids) {
                    connectedPlayerIds = data.player_ids;
                }
            }
        };

        ws.onclose = () => setTimeout(conectar, 3000);
    }

    function sendInput(actionName, stateName) {
        if (ws && ws.readyState === WebSocket.OPEN)
            ws.send(JSON.stringify({ type: "input", action: actionName, state: stateName }));
    }

    function sendJoystick(axisX, axisY) {
        if (ws && ws.readyState === WebSocket.OPEN)
            ws.send(JSON.stringify({ type: "joystick", axis_x: axisX, axis_y: axisY }));
    }

    // ================================================================
    //  BOTÓN UNIRSE
    // ================================================================
    btnJoin.addEventListener('click', async () => {
        if (ws && ws.readyState === WebSocket.OPEN) {
            ws.send(JSON.stringify({ type: "join" }));

            try {
                if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen');
            } catch (err) { /* ignore */ }
        }
    });

    // ================================================================
    //  AVATAR — CARGA DE IMAGEN
    // ================================================================
    function handleImageUpload(e) {
        const file = e.target.files[0];
        if (!file) return;

        // Aceptar image/*, type vacío (cámara Android) y application/pdf (hack galería Android)
        if (!file.type.startsWith('image/') && file.type !== '' && file.type !== 'application/pdf') {
            alert("¡Por favor, elige una foto válida!");
            return;
        }

        const reader = new FileReader();
        reader.onload = (event) => {
            cropImage.src = event.target.result;
            cropImage.onload = () => {
                // Calcular escala mínima para que la imagen cubra el frame (240px) sin huecos
                const frameSize = 240;
                const fitScale  = Math.max(
                    frameSize / cropImage.naturalWidth,
                    frameSize / cropImage.naturalHeight
                );
                // El slider va desde fitScale (imagen ajustada) hasta 3x fitScale
                zoomSlider.min   = fitScale.toFixed(6);
                zoomSlider.max   = (fitScale * 3).toFixed(6);
                zoomSlider.step  = "0.0001";
                currentScale     = fitScale;
                zoomSlider.value = fitScale;
                imgCenterX = 0;
                imgCenterY = 0;
                updateTransform();

                mostrarSoloScreen(null);
                document.querySelectorAll('.screen').forEach(s => s.style.display = 'none');
                cropScreen.style.display = "flex";
                checkOrientation();
            };
        };
        reader.readAsDataURL(file);
        e.target.value = '';
    }

    avatarInput.addEventListener('change', handleImageUpload);

    // ================================================================
    //  CROPPER — MATEMÁTICAS (NO MODIFICAR)
    // ================================================================
    function clampDrag() {
        const frameSize = 240;
        const maxX = Math.max(0, (cropImage.naturalWidth  * currentScale - frameSize) / 2);
        const maxY = Math.max(0, (cropImage.naturalHeight * currentScale - frameSize) / 2);
        imgCenterX = Math.max(-maxX, Math.min(maxX, imgCenterX));
        imgCenterY = Math.max(-maxY, Math.min(maxY, imgCenterY));
    }

    function updateTransform() {
        cropImage.style.transform =
            `translate(-50%, -50%) translate(${imgCenterX}px, ${imgCenterY}px) scale(${currentScale})`;
    }

    function getDistance(t1, t2) {
        return Math.hypot(t2.clientX - t1.clientX, t2.clientY - t1.clientY);
    }

    function onDragStart(e) {
        if (e.touches && e.touches.length === 2) {
            isDragging = false;
            initialDistance = getDistance(e.touches[0], e.touches[1]);
            initialScale = parseFloat(currentScale);
            // Guardar punto medio inicial y centro de imagen para pinch+pan
            initialPinchMidX = (e.touches[0].clientX + e.touches[1].clientX) / 2;
            initialPinchMidY = (e.touches[0].clientY + e.touches[1].clientY) / 2;
            initialCenterX = imgCenterX;
            initialCenterY = imgCenterY;
            return;
        }
        isDragging = true;
        let cx = e.touches ? e.touches[0].clientX : e.clientX;
        let cy = e.touches ? e.touches[0].clientY : e.clientY;
        startX = cx - imgCenterX;
        startY = cy - imgCenterY;
    }

    function onDragMove(e) {
        if (e.touches && e.touches.length === 2) {
            e.preventDefault();
            if (initialDistance > 0) {
                const d = getDistance(e.touches[0], e.touches[1]);
                let ns = initialScale * (d / initialDistance);
                const minS = parseFloat(zoomSlider.min) || 0.01;
                const maxS = parseFloat(zoomSlider.max) || 3;
                currentScale = Math.max(minS, Math.min(maxS, ns));
                zoomSlider.value = currentScale;
                // Pan simultáneo: mover según desplazamiento del punto medio
                const midX = (e.touches[0].clientX + e.touches[1].clientX) / 2;
                const midY = (e.touches[0].clientY + e.touches[1].clientY) / 2;
                imgCenterX = initialCenterX + (midX - initialPinchMidX);
                imgCenterY = initialCenterY + (midY - initialPinchMidY);
                clampDrag();
                updateTransform();
            }
            return;
        }
        if (!isDragging) return;
        e.preventDefault();
        let cx = e.touches ? e.touches[0].clientX : e.clientX;
        let cy = e.touches ? e.touches[0].clientY : e.clientY;
        imgCenterX = cx - startX;
        imgCenterY = cy - startY;
        clampDrag();
        updateTransform();
    }

    function onDragEnd(e) {
        if (e.touches && e.touches.length === 1) {
            isDragging = true;
            startX = e.touches[0].clientX - imgCenterX;
            startY = e.touches[0].clientY - imgCenterY;
        } else {
            isDragging = false;
            initialDistance = 0;
        }
    }

    cropImage.addEventListener('mousedown',  onDragStart);
    cropImage.addEventListener('mousemove',  onDragMove);
    window.addEventListener('mouseup',       onDragEnd);
    cropImage.addEventListener('touchstart', onDragStart, { passive: false });
    cropImage.addEventListener('touchmove',  onDragMove,  { passive: false });
    window.addEventListener('touchend',      onDragEnd);

    zoomSlider.addEventListener('input', (e) => {
        currentScale = parseFloat(e.target.value);
        clampDrag();
        updateTransform();
    });

    // ================================================================
    //  CROPPER — ACCIONES
    // ================================================================
    document.getElementById('btn-retake-crop').addEventListener('click', () => {
        cropScreen.style.display = "none";
        mostrarSoloScreen("screen-espera");
    });

    document.getElementById('btn-confirm-crop').addEventListener('click', () => {
        const finalCanvas = document.createElement('canvas');
        finalCanvas.width  = SIZE;
        finalCanvas.height = SIZE;
        const ctx = finalCanvas.getContext('2d');

        // Recorte circular con transparencia
        ctx.beginPath();
        ctx.arc(SIZE / 2, SIZE / 2, SIZE / 2, 0, Math.PI * 2);
        ctx.clip();

        // Replicar la vista visual en el canvas pequeño (NO TOCAR)
        const k = SIZE / 250.0;
        const origW = cropImage.naturalWidth;
        const origH = cropImage.naturalHeight;

        ctx.translate(SIZE / 2, SIZE / 2);
        ctx.scale(k, k);
        ctx.scale(currentScale, currentScale);
        ctx.translate(imgCenterX / currentScale, imgCenterY / currentScale);
        ctx.drawImage(cropImage, -origW / 2, -origH / 2, origW, origH);

        const base64String = finalCanvas.toDataURL('image/png', 1.0);
        finalBase64Data    = base64String.split(',')[1];

        cropScreen.style.display = "none";
        mostrarSoloScreen("screen-espera");

        // Mostrar vista previa
        captureOptions.style.display = "none";
        previewPhoto.src = base64String;
        cameraText.innerText = "◆ ASÍ TE VERÁN ◆";
        previewBox.style.display = "flex";
    });

    // ================================================================
    //  AVATAR — RETOMAR Y ENVIAR
    // ================================================================
    document.getElementById('btn-retake-photo').addEventListener('click', () => {
        previewBox.style.display   = "none";
        captureOptions.style.display = "flex";
        cameraText.innerText       = "▶ ELIGE TU AVATAR ◀";
    });

    btnSendPhoto.addEventListener('click', () => {
        if (ws && ws.readyState === WebSocket.OPEN && finalBase64Data !== "") {
            ws.send(JSON.stringify({ type: "face_photo", data: finalBase64Data }));
            photoContainer.style.display = "none";
            txtEspera.innerText = "▼ FOTO ENVIADA · ESPERANDO ▼";
        }
    });

    // ================================================================
    //  CONTROLES — BOTONES (touch events con preventDefault)
    // ================================================================
    document.querySelectorAll('.control-btn').forEach(btn => {
        const action = btn.getAttribute('data-action');
        const isGigante = btn.id === "btn-gigante";
        const isDash    = btn.classList.contains('btn-dash');
        const isDir     = btn.classList.contains('btn-dir');

        const pressClass   = isGigante ? 'btn-pressed-gigante' : (isDash ? 'btn-pressed-dash' : 'btn-pressed-dir');

        btn.addEventListener('touchstart', (e) => {
            e.preventDefault();
            btn.classList.add(pressClass);
            vibrar();
            sendInput(action, "pressed");
        }, { passive: false });

        btn.addEventListener('touchend', (e) => {
            e.preventDefault();
            btn.classList.remove(pressClass);
            sendInput(action, "released");
        }, { passive: false });
    });

    // ================================================================
    //  CONTROLES — JOYSTICK TÁCTIL (touch-action: none preservado)
    // ================================================================
    const joyZone  = document.getElementById('joy-zone');
    const joyBase  = document.getElementById('joy-base');
    const joyStick = document.getElementById('joy-stick');

    let joyActive   = false;
    let joyTouchId  = null;
    let joyCenter   = { x: 0, y: 0 };
    let lastJoySend = 0;

    joyZone.addEventListener('touchstart', (e) => {
        e.preventDefault();
        if (joyActive) return;
        vibrar();
        const t = e.changedTouches[0];
        joyTouchId  = t.identifier;
        joyActive   = true;
        const r     = joyZone.getBoundingClientRect();
        joyCenter   = { x: t.clientX - r.left, y: t.clientY - r.top };
        joyBase.style.display = 'block';
        joyBase.style.left    = joyCenter.x + 'px';
        joyBase.style.top     = joyCenter.y + 'px';
        joyStick.style.left   = '60px';
        joyStick.style.top    = '60px';
        sendJoystick(0, 0);
    });

    joyZone.addEventListener('touchmove', (e) => {
        e.preventDefault();
        if (!joyActive) return;
        let t = Array.from(e.changedTouches).find(t => t.identifier === joyTouchId);
        if (!t) return;
        const r  = joyZone.getBoundingClientRect();
        let dx   = (t.clientX - r.left) - joyCenter.x;
        let dy   = (t.clientY - r.top)  - joyCenter.y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        if (dist > 60) { dx = (dx / dist) * 60; dy = (dy / dist) * 60; }
        joyStick.style.left = (60 + dx) + 'px';
        joyStick.style.top  = (60 + dy) + 'px';
        const now = Date.now();
        if (now - lastJoySend > 50) {
            sendJoystick(parseFloat((dx / 60).toFixed(2)), parseFloat((dy / 60).toFixed(2)));
            lastJoySend = now;
        }
    });

    joyZone.addEventListener('touchend', (e) => {
        e.preventDefault();
        if (!joyActive) return;
        if (Array.from(e.changedTouches).find(t => t.identifier === joyTouchId)) {
            joyActive  = false;
            joyTouchId = null;
            joyBase.style.display = 'none';
            sendJoystick(0, 0);
        }
    });

    // ================================================================
    //  TOP BAR — FULLSCREEN
    // ================================================================
    document.getElementById('btn-fullscreen').addEventListener('click', () => {
        if (!document.fullscreenElement) {
            document.documentElement.requestFullscreen().catch(() => {});
        } else {
            document.exitFullscreen().catch(() => {});
        }
        vibrar();
    });

    // ================================================================
    //  TOP BAR — AJUSTES
    // ================================================================
    const settingsBackdrop = document.getElementById('settings-backdrop');
    const toggleVibration  = document.getElementById('toggle-vibration');
    let vibrationEnabled   = true;

    // Override vibrar para respetar el toggle
    const _vibrarOriginal = vibrar;
    function vibrar() { if (vibrationEnabled && navigator.vibrate) navigator.vibrate(40); }

    document.getElementById('btn-settings').addEventListener('click', () => {
        settingsBackdrop.classList.add('open');
    });

    document.getElementById('btn-close-settings').addEventListener('click', () => {
        settingsBackdrop.classList.remove('open');
    });

    settingsBackdrop.addEventListener('click', (e) => {
        if (e.target === settingsBackdrop) settingsBackdrop.classList.remove('open');
    });

    toggleVibration.addEventListener('change', () => {
        vibrationEnabled = toggleVibration.checked;
    });

    document.getElementById('btn-reconnect').addEventListener('click', () => {
        settingsBackdrop.classList.remove('open');
        vibrar();
        if (ws) {
            ws.onclose = null; // Evitar auto-reconexión duplicada
            ws.close();
        }
        conectar();
    });

    // ================================================================
    //  DAR HOST
    // ================================================================
    let connectedPlayerIds = []; // Se actualiza cuando llega welcome o host_status

    document.getElementById('btn-dar-host').addEventListener('click', () => {
        const panel = document.getElementById('host-transfer-panel');
        const isOpen = panel.classList.contains('open');
        if (isOpen) {
            panel.classList.remove('open');
            return;
        }
        // Rellenar con los jugadores disponibles (todos excepto yo)
        const myId = parseInt(hudPlayerName.innerText.replace('JUGADOR ', '')) || 0;
        panel.innerHTML = '';
        const others = connectedPlayerIds.filter(id => id !== myId);
        if (others.length === 0) {
            panel.innerHTML = '<span style="font-family:var(--font-pixel);font-size:0.4rem;color:var(--clr-muted);text-align:center">NO HAY OTROS JUGADORES</span>';
        } else {
            others.forEach(id => {
                const btn = document.createElement('button');
                btn.className = 'btn-player-select';
                btn.innerText = '→ JUGADOR ' + id;
                btn.addEventListener('click', () => {
                    if (ws && ws.readyState === WebSocket.OPEN) {
                        ws.send(JSON.stringify({ type: "transfer_host", to_player_id: id }));
                        vibrar();
                    }
                    panel.classList.remove('open');
                    settingsBackdrop.classList.remove('open');
                });
                panel.appendChild(btn);
            });
        }
        panel.classList.add('open');
    });

    // ================================================================
    //  ORIENTACIÓN
    // ================================================================
    // Overlay vertical: activo en espera/crop si el móvil está horizontal
    const SCREENS_PORTRAIT = ['screen-espera', 'crop-screen'];

    const overlayPortrait  = document.getElementById('overlay-portrait');
    const overlayLandscape = document.getElementById('overlay-landscape');

    // El overlay horizontal se activa manualmente cuando Godot manda change_layout
    // y se desactiva cuando el usuario gira el móvil a horizontal
    let mandoActivo = false;

    function getScreenActiva() {
        if (cropScreen.style.display === 'flex') return 'crop-screen';
        const visible = [...document.querySelectorAll('.screen')].find(s => s.style.display && s.style.display !== 'none');
        return visible ? visible.id : null;
    }

    function checkOrientation() {
        const isLandscape = window.innerWidth > window.innerHeight;
        const screenId    = getScreenActiva();

        // Overlay "pon en vertical": solo en pantallas de unirse/foto/crop
        overlayPortrait.classList.toggle('active', SCREENS_PORTRAIT.includes(screenId) && isLandscape);

        // Overlay "pon en horizontal": solo cuando estamos en el mando y está vertical
        if (mandoActivo) {
            overlayLandscape.classList.toggle('active', !isLandscape);
        }
    }

    window.addEventListener('resize', checkOrientation);
    screen.orientation?.addEventListener('change', checkOrientation);
    checkOrientation();

    // ================================================================
    //  LOBBY HOST — BOTÓN COMENZAR
    // ================================================================
    document.getElementById('btn-comenzar').addEventListener('touchstart', (e) => {
        e.preventDefault();
        vibrar();
        if (ws && ws.readyState === WebSocket.OPEN) {
            ws.send(JSON.stringify({ type: "start_game" }));
        }
        // Fullscreen al iniciar partida
        if (!document.fullscreenElement && document.documentElement.requestFullscreen) {
            document.documentElement.requestFullscreen().catch(() => {});
        }
    }, { passive: false });

    // ================================================================
    //  INIT
    // ================================================================
    conectar();
    </script>
</body>
</html>
